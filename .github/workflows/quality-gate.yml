name: Engineering Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  workflow-gate:
    name: Definition of Ready (Workflow Gate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify Definition of Ready Inputs
        run: node scripts/verify-pr-dor.js
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}

  test-web:
    name: Frontend Test Net (Web)
    runs-on: ubuntu-latest
    needs: [workflow-gate]
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck & Build
        run: npm run build

      - name: Run Test Suite (Vitest)
        run: npm test

  test-api:
    name: Backend Test Net (API)
    runs-on: ubuntu-latest
    needs: [workflow-gate]
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: ai_interview_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-cmd-interval 10s
          --health-cmd-timeout 5s
          --health-cmd-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-cmd-interval 10s
          --health-cmd-timeout 5s
          --health-cmd-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3.2
          bundler-cache: true
          working-directory: api

      - name: Setup Test Database
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:password@localhost:5432/ai_interview_test
          REDIS_URL: redis://localhost:6379/1
        run: |
          bundle exec rails db:test:prepare || bundle exec rails db:schema:load

      - name: Run RSpec Tests
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:password@localhost:5432/ai_interview_test
          REDIS_URL: redis://localhost:6379/1
        run: bundle exec rspec
